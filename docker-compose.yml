services:
  postgres:
    image: postgres:16-alpine
    container_name: alanya_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alanya_realty
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alanya_realty"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: alanya_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - TZ=Europe/Istanbul
    volumes:
      - n8n_data:/home/node/.n8n

  bot:
    build: .
    container_name: alanya_bot
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/alanya_realty
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  n8n_data: